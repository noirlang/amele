name: Agent CI/CD Release

on:
  push:
    paths:
      - 'agent/**'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-agent:
    if: github.repository == 'amele-next/amele-next'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r agent/requirements-linux.txt

      - name: Build Linux agent
        run: |
          pyinstaller --onefile --name amele-linux agent/linux.py
          ls -la dist/

      - name: Upload Linux agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: amele-linux
          path: dist/amele-linux

  build-windows-agent:
    if: github.repository == 'amele-next/amele-next'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r agent/requirements-windows.txt

      - name: Build Windows agent
        run: |
          pyinstaller --onefile --name amele-win agent/windows.py
          dir dist/

      - name: Upload Windows agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: amele-win
          path: dist/amele-win.exe

  release:
    needs: [build-linux-agent, build-windows-agent]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: (github.repository == 'amele-next/amele-next') && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
    steps:
      - name: Download Linux agent
        uses: actions/download-artifact@v4
        with:
          name: amele-linux
          path: artifacts/

      - name: Download Windows agent
        uses: actions/download-artifact@v4
        with:
          name: amele-win
          path: artifacts/

      - name: Set version
        id: version
        run: echo "version=$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agent-${{ steps.version.outputs.version }}
          name: Agent Release ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            artifacts/amele-linux
            artifacts/amele-win.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
