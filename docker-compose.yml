services:
  amele:
    build:
      context: .
      dockerfile: Dockerfile
    image: amele:latest
    container_name: amele
    ports:
      - "8080:8080"
    environment:
      - AMELE_HOST=0.0.0.0
      - AMELE_PORT=8080
      - AMELE_NO_BROWSER=1
      - AMELE_ALLOW_REMOTE=1
    volumes:
      - amele-config:/root/.config/amele
      - amele-cases:/cases
      - amele-evidence:/evidence
    restart: unless-stopped

volumes:
  amele-config:
    name: amele_config
  amele-cases:
    name: amele_cases
  amele-evidence:
    name: amele_evidence
