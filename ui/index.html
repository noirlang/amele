<!-- ana html kabuğu. masaüstü hissi versin diye sağ tık f12 falan engelli, sayfalar js ile dinamik basılıyo. -->

<!doctype html>
<html lang="tr" class="notranslate" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <title>Amele Forensic Tool</title>
    <link rel="icon" type="image/png" href="./assets/logo/icon.png" />
    <link rel="stylesheet" href="./styles.css" />
    <script>
      // masaüstü gibi dursun diye sağ tık ve devtools kısayollarını kapatıyoruz
      const isDebug = new URLSearchParams(window.location.search).get("debug") === "1";
      if (!isDebug) {
        window.addEventListener("contextmenu", (e) => {
          e.preventDefault();
        }, { capture: true });
        window.addEventListener("keydown", (e) => {
          const isMac = /mac/i.test(navigator.platform);
          const modKey = isMac ? e.metaKey : e.ctrlKey;

          // f5 ve ctrl+r engelle
          if (e.key === "F5" || (modKey && (e.key === "r" || e.key === "R"))) {
            e.preventDefault();
          }

          // f12 engelle
          if (e.key === "F12") {
            e.preventDefault();
            e.stopPropagation();
          }
          if (modKey && e.shiftKey && ["I", "i", "J", "j", "C", "c"].includes(e.key)) {
            e.preventDefault();
            e.stopPropagation();
          }
          if (modKey && !e.shiftKey && ["u", "U", "s", "S", "p", "P"].includes(e.key)) {
            e.preventDefault();
            e.stopPropagation();
          }
        }, { capture: true });
      }
      try {
        if (localStorage.getItem("amele-sidebar-collapsed") === "1") {
          document.documentElement.classList.add("sidebar-collapsed");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app" class="shell theme-dark">
      <script>
        try {
          if (localStorage.getItem("amele-sidebar-collapsed") === "1") {
            document.getElementById("app")?.classList.add("sidebar-collapsed");
          }
        } catch (e) {}
      </script>
      <div id="radial-nav-container"></div>
      <div id="case-sidebar-container"></div>
      <div id="report-sidebar-container"></div>

      <section class="workspace">
        <main id="view" class="view" tabindex="-1"></main>
      </section>
      <div id="profile-gate" class="profile-gate" hidden></div>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
